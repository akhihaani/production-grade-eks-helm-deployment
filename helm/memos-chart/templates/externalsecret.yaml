{{- if .Values.database.enabled }}
# Tells External Secrets Operator where to read secrets from (AWS Secrets Manager).
# Auth uses the ESO controller's IRSA role, so no credentials are needed here.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: memos-aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.database.region }}
---
# Pulls the RDS username/password and assembles a ready-to-use MEMOS_DSN into a
# Kubernetes secret named `memos-db`. Host/port/name come from Helm values (the rds
# outputs); username/password come from Secrets Manager at sync time.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: memos-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: memos-aws-secrets
    kind: SecretStore
  target:
    name: memos-db
    template:
      engineVersion: v2
      data:
        # The braces wrapped in backticks are ESO's OWN templating, left intact for ESO
        # to fill at sync time. Everything else is rendered by Helm now.
        MEMOS_DSN: "postgres://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}?sslmode=require"
  data:
    - secretKey: username
      remoteRef:
        key: {{ .Values.database.awsSecretName | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.awsSecretName | quote }}
        property: password
{{- end }}
