# Runs automatically on `git commit` once you run `pre-commit install`.
# If any hook fails, the commit is blocked, so problems are caught locally,
# before code ever enters git history (not after, the way a CI-only check would).

repos:
  # Standard hygiene, plus a private-key guard. No extra tooling needed.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Helm templates are Go-templated, so they aren't valid standalone YAML.
        exclude: ^helm/memos-chart/templates/

  # Secret scanning: catches AWS keys, tokens, and the like in staged changes.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Keep Terraform canonically formatted.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.0
    hooks:
      - id: terraform_fmt
