name: memos-cluster-pipeline

on:
  workflow_dispatch: # manually run from the Github UI

permissions:
  id-token: write    # required for OIDC — lets the workflow request a JWT
  contents: read     # needed for actions/checkout to clone the repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repo # Clones your repo onto the VM that runs this workflow
        uses: actions/checkout@v6

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/memos_github_role
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v6

      - name: Install Terragrunt
        uses: eLco/setup-terragrunt@v1

      - name: Terragrunt Init
        working-directory: Terraform/infra
        run: terragrunt run --all init

      - name: Terraform Format
        working-directory: Terraform/infra
        run: terraform fmt -check -recursive

      - name: Terragrunt Validate
        working-directory: Terraform/infra
        run: terragrunt run --all validate

      - name: Terraform Lint
        working-directory: Terraform/infra
        run: tflint --recursive

      - name: Terragrunt Run
        working-directory: Terraform/infra
        run: terragrunt run --all apply --non-interactive -- -parallelism=1

      - name: Apply ClusterIssuer
        run: |
          aws eks update-kubeconfig --name memos-eks-cluster --region ${{ vars.AWS_REGION }}
          kubectl apply -f manifests/clusterIssuer-prod.yaml
          kubectl apply -f manifests/clusterIssuer-staging.yaml

      - name: Apply Application
        run: |
          aws eks update-kubeconfig --name memos-eks-cluster --region ${{ vars.AWS_REGION }}
          kubectl apply -f manifests/application.yaml

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1

      - name: Install NGINX Ingress
        run: |
          aws eks update-kubeconfig --name memos-eks-cluster --region ${{ vars.AWS_REGION }}
          helm repo add nginx-stable https://helm.nginx.com/stable
          helm repo update
          helm upgrade --install nginx-ingress-controller nginx-stable/nginx-ingress \
            --namespace nginx-ingress --create-namespace \
            --set prometheus.create=true \
            --set prometheus.service.create=true \
            --set-string controller.service.annotations."service\.beta\.kubernetes\.io/aws-load-balancer-type"=nlb \
            --skip-schema-validation

      - name: Apply nginx ServiceMonitor
        run: kubectl apply -f manifests/nginx-servicemonitor.yaml

      - name: Provision Grafana dashboards
        run: |
          kubectl create configmap nginx-ingress-dashboard \
            --from-file=nginx-ingress.json=monitoring/dashboards/nginx-ingress.json \
            -n monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl label configmap nginx-ingress-dashboard -n monitoring \
            grafana_dashboard=1 --overwrite
