# Annotate the External Secrets Operator controller service account so it assumes
# the external_secrets IAM role via IRSA. That role can read the RDS master secret
# from AWS Secrets Manager and decrypt it with the RDS KMS key, nothing else.
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::310829530244:role/external_secrets"
    # ARN of the external_secrets IAM role created in eks-addons.tf
